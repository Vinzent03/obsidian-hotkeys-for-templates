name: Release Obsidian Plugin

on:
  push:
    tags:
      - '*'

permissions:
  contents: write

env:
  PLUGIN_NAME: obsidian-hotkeys-for-templates

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Verify release version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          node --input-type=module <<'JS'
          import { readFileSync } from 'node:fs';
          const pkg = JSON.parse(readFileSync('package.json', 'utf8'));
          const manifest = JSON.parse(readFileSync('manifest.json', 'utf8'));
          if (pkg.version !== manifest.version || manifest.version !== process.env.RELEASE_TAG) {
            throw new Error('Package, manifest, and release tag versions must match');
          }
          JS
      - name: Build
        run: pnpm run build
      - name: Package
        run: |
          mkdir "$PLUGIN_NAME"
          cp main.js manifest.json README.md "$PLUGIN_NAME"
          zip -r "$PLUGIN_NAME-${GITHUB_REF_NAME}.zip" "$PLUGIN_NAME"
      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref }}
          name: ${{ github.ref_name }}
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: |
            main.js
            manifest.json
            ${{ env.PLUGIN_NAME }}-${{ github.ref_name }}.zip
